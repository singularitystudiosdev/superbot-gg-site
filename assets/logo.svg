<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- halftone dash texture, like a textmode raster -->
    <pattern id="ht" width="7" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="4.6" height="1.9" rx="0.9" fill="#e8e4d9"/>
    </pattern>
    <pattern id="htDim" width="7" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="3.2" height="1.6" rx="0.8" fill="#6a675c"/>
    </pattern>
  </defs>

  <!-- badge -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="#0c0d10"/>
  <rect x="14" y="14" width="228" height="228" rx="48" fill="none" stroke="url(#htDim)" stroke-width="3"/>

  <!-- big horn-ears (smol wears them oversized) -->
  <path d="M74 106 Q52 56 96 66 Q108 80 92 108 Z" fill="url(#ht)"/>
  <path d="M182 106 Q204 56 160 66 Q148 80 164 108 Z" fill="url(#ht)"/>

  <!-- small round head -->
  <rect x="60" y="94" width="136" height="102" rx="40" fill="url(#ht)"/>

  <!-- face: huge open eye, wide wink. winks smile: a small mouth shows -->
  <ellipse cx="102" cy="140" rx="17" ry="20" fill="#0c0d10"/>
  <rect x="136" y="134" width="40" height="12" rx="6" fill="#0c0d10"/>
  <path d="M116 168 Q128 178 140 168 Z" fill="#0c0d10"/>
</svg>
